<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Product Development Lifecycle — Concept Graph</title>
<style>
  :root{
    --bg:#0f1419; --panel:#161c24; --panel2:#1d2530; --line:#2b3543; --line2:#3a4757;
    --ink:#e7edf3; --ink-dim:#9aa7b4; --ink-faint:#647280;
    --accent:#5aa9e6; --loop:#e0734d; --route:#7bc96f; --cp:#caa14a;
    --kind-exploratory:#6fb1d6; --kind-definitional:#a78bd6;
    --kind-implementation:#6fcf97; --kind-validation:#e6c14d; --kind-governance:#e08a5a;
    --theme-method:#a78bd6; --theme-tool:#5aa9e6; --theme-metric:#e6c14d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
  #app{display:flex;flex-direction:column;height:100vh}
  header{padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header h1{font-size:14px;margin:0;font-weight:650;padding:11px 0}
  header h1 span{color:var(--ink-faint);font-weight:400}
  .tabs{display:flex;gap:2px;align-self:flex-end}
  .tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--ink-dim);
    padding:11px 14px;cursor:pointer;font-size:13px;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{color:#fff;border-bottom-color:var(--accent)}
  #search{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:6px 10px;border-radius:6px;width:200px;font-size:12px}
  #main{flex:1;display:flex;min-height:0}
  #side{width:248px;flex:0 0 248px;border-right:1px solid var(--line);background:var(--panel);
    overflow-y:auto;padding:14px 14px 30px}
  #side .vtitle{font-size:13px;font-weight:650;color:var(--ink);margin-bottom:4px}
  #side .vdesc{font-size:12px;color:var(--ink-dim);line-height:1.5;margin-bottom:14px}
  #side h2{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint);margin:16px 0 7px}
  .layer{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;color:var(--ink-dim)}
  .layer:hover{background:var(--panel2);color:var(--ink)}
  .layer.on{color:var(--ink)}
  .layer .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px;border:1px solid #0006}
  .layer .ln{width:22px;border-top-width:3px;border-top-style:solid;flex:0 0 22px}
  .layer .chk{margin-left:auto;width:14px;height:14px;border:1px solid var(--line);border-radius:4px;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
  .layer.on .chk{background:var(--accent);border-color:var(--accent);color:#08121c}
  .legendrow{display:flex;align-items:center;gap:8px;color:var(--ink-dim);padding:3px 6px;font-size:12px}
  .legendrow .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
  .legendrow .ln{width:22px;border-top-width:3px;border-top-style:solid;flex:0 0 22px}
  #view{flex:1;position:relative;overflow:auto;background:
    radial-gradient(circle at 1px 1px,#1a212b 1px,transparent 0) 0 0/26px 26px,var(--bg)}
  svg{display:block;cursor:grab}
  svg.drag{cursor:grabbing}
  /* spatial cards */
  .bandlabel{fill:var(--ink-dim);font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .card{cursor:pointer}
  .card rect.bx{fill:var(--panel2);stroke:var(--line);stroke-width:1.2}
  .card:hover rect.bx{stroke:var(--accent)}
  .card.sel rect.bx{stroke:var(--accent);stroke-width:2.4}
  .card.dim{opacity:.25}
  .card .nm{fill:var(--ink);font-size:11.5px;font-weight:550}
  .cp rect.bx{fill:#2a2415;stroke:var(--cp)}
  .cp .nm{fill:#f0dca0}
  .edge{fill:none}
  .e-precede{stroke:var(--line2);stroke-width:1.5}
  .e-loop{stroke:var(--loop);stroke-width:1.7;stroke-dasharray:5 4}
  .e-route{stroke:var(--route);stroke-width:1.7}
  .elabel{font-size:9.5px;font-weight:600}
  /* matrix / table */
  .gridwrap{padding:18px 22px 60px}
  table.mx{border-collapse:separate;border-spacing:0;font-size:12px}
  table.mx th.corner{position:sticky;left:0;top:0;z-index:5;background:var(--bg)}
  table.mx thead th.col{height:150px;vertical-align:bottom;padding:0 0 8px 0;position:sticky;top:0;
    background:linear-gradient(to bottom,var(--bg) 70%,transparent);z-index:3}
  table.mx thead th.col div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;
    font-weight:500;color:var(--ink-dim);font-size:11px;cursor:pointer;max-height:140px;overflow:hidden;text-overflow:ellipsis}
  table.mx thead th.col.cp div{color:var(--cp);font-weight:600}
  table.mx thead th.band{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);
    text-align:center;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:600;position:sticky;top:0;background:var(--bg);z-index:3}
  table.mx td.rowlbl,table.mx th.rowlbl{position:sticky;left:0;background:var(--panel);z-index:2;
    text-align:left;padding:7px 12px 7px 10px;white-space:nowrap;border-right:1px solid var(--line);cursor:pointer;min-width:180px}
  table.mx td.rowlbl:hover{background:var(--panel2)}
  table.mx td.rowlbl .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:middle}
  table.mx td.cell{width:24px;height:30px;text-align:center;border-bottom:1px solid #ffffff08}
  table.mx td.cell.bandsep{border-left:1px solid var(--line)}
  table.mx td.cell .dot{width:13px;height:13px;border-radius:3px;display:inline-block;cursor:pointer}
  table.mx tr:hover td.cell{background:#ffffff06}
  /* operating table */
  table.op{border-collapse:collapse;font-size:12.5px;width:calc(100% - 0px)}
  table.op th{text-align:left;color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:.6px;
    padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
  table.op td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.op tr.bandhead td{background:var(--panel2);color:var(--ink-dim);font-weight:600;font-size:10px;
    text-transform:uppercase;letter-spacing:.6px;padding:7px 12px}
  table.op td.stg{font-weight:550;cursor:pointer;min-width:200px}
  table.op td.stg:hover{color:var(--accent)}
  table.op .role{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  table.op .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;
    padding:2px 7px;margin:2px 4px 2px 0;font-size:11px;color:var(--ink-dim);cursor:pointer}
  table.op .chip:hover{color:var(--ink);border-color:var(--line2)}
  table.op .chip.prod{border-left:3px solid var(--kind-implementation)}
  table.op .chip.cons{border-left:3px solid var(--ink-faint)}
  .informs-list{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);max-width:760px}
  .informs-list h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);margin:0 0 8px}
  .informs-list .il{padding:5px 0;color:var(--ink-dim);font-size:12.5px}
  .informs-list .il b{color:var(--ink);font-weight:600}
  .informs-list .il .arr{color:#5b6b9e;margin:0 8px}
  /* sources */
  .srcwrap{max-width:1100px}
  .srcwrap h2.srch{font-size:14px;font-weight:650;color:var(--ink);text-transform:none;letter-spacing:0;
    margin:6px 0 4px;padding-top:14px}
  .srcwrap h2.srch:not(:first-child){margin-top:30px;border-top:1px solid var(--line);padding-top:22px}
  .srcsub{color:var(--ink-dim);font-size:12.5px;margin-bottom:14px;max-width:760px;line-height:1.5}
  table.src{border-collapse:collapse;width:100%;font-size:12.5px}
  table.src th{text-align:left;color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:.6px;
    padding:8px 12px;border-bottom:1px solid var(--line)}
  table.src td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.src td.cid{color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  table.src td.csrc{font-weight:550;min-width:200px;max-width:260px}
  table.src td.cuse{color:var(--ink-dim);max-width:300px;line-height:1.45}
  table.src td.ctier{white-space:nowrap}
  table.src .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  table.src .cnote{color:var(--ink-faint);font-size:11px;margin-top:5px;max-width:200px;line-height:1.4;text-transform:none;letter-spacing:0;font-weight:400}
  table.src td.crec a{color:var(--accent);text-decoration:none;font-size:12px}
  table.src td.crec a:hover{text-decoration:underline}
  .liblist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .libcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .libarea{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim);
    margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .libitem{display:block;color:var(--accent);text-decoration:none;padding:4px 0;font-size:12.5px;line-height:1.35}
  .libitem:hover{text-decoration:underline}
  /* products */
  .minibtn{margin:8px 6px 0;display:inline-block;font-size:11px;color:var(--accent);cursor:pointer}
  .minibtn:hover{text-decoration:underline}
  .prodwrap{max-width:1200px}
  .prodcount{color:var(--ink-dim);font-size:12px;margin-bottom:10px}
  .prodgrouphd{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);
    font-weight:700;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .prodcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .prodcard:hover{border-color:var(--line2)}
  .prodhead{display:flex;align-items:center;gap:8px}
  .prodname{font-weight:650;font-size:13.5px;flex:1}
  .prodstatus{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:20px}
  .prodvendor{color:var(--ink-faint);font-size:11px;margin-top:1px}
  .prodtags{margin:8px 0 6px;display:flex;flex-wrap:wrap;gap:4px}
  .prodtag{font-size:9.5px;color:var(--ink-dim);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .prodstages{margin-top:4px}
  .prodstage{font-size:11.5px;line-height:1.45;padding:1px 0}
  .prodstage .ps-stage{color:var(--accent);cursor:pointer}
  .prodstage .ps-stage:hover{text-decoration:underline}
  .prodstage .ps-feat{color:var(--ink-dim)}
  .prodnote{margin-top:8px;color:var(--ink-faint);font-size:11px;font-style:italic;line-height:1.4}
  .segtoggle{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-bottom:12px}
  .segbtn{background:var(--panel2);border:none;color:var(--ink-dim);padding:7px 16px;cursor:pointer;font-size:12.5px}
  .segbtn+.segbtn{border-left:1px solid var(--line2)}
  .segbtn:hover{color:var(--ink)}
  .segbtn.on{background:#27405a;color:#fff}
  .prodhint{color:var(--ink-faint);font-size:11.5px;margin-bottom:10px}
  table.mx tr.mxgrouprow td.mxgroup{position:sticky;left:0;background:var(--panel2);color:var(--ink-dim);
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:7px 10px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  table.mx td.rowlbl.prodrow{font-weight:500;min-width:170px;font-size:12px}
  table.mx td.rowlbl.prodrow .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
  a.prodlink{color:inherit;text-decoration:none}
  a.prodlink:hover{color:var(--accent);text-decoration:underline}
  /* detail */
  #detail{position:fixed;top:0;right:0;height:100%;width:340px;background:var(--panel);
    border-left:1px solid var(--line);transform:translateX(105%);transition:transform .18s ease;
    overflow-y:auto;padding:18px 18px 50px;box-shadow:-12px 0 30px #0006;z-index:20}
  #detail.open{transform:translateX(0)}
  #detail .x{position:absolute;top:13px;right:15px;cursor:pointer;color:var(--ink-faint);font-size:20px}
  #detail .x:hover{color:var(--ink)}
  #detail .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);color:var(--ink-dim);margin:0 4px 4px 0}
  #detail h3{margin:4px 60px 6px 0;font-size:17px}
  #detail .desc{color:var(--ink-dim);line-height:1.55;margin-bottom:10px}
  #detail .rel{margin-top:12px}
  #detail .rel h4{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);
    margin:0 0 5px;border-bottom:1px solid var(--line);padding-bottom:4px}
  #detail .rel a{display:block;color:var(--accent);text-decoration:none;padding:3px 0;cursor:pointer;font-size:12.5px}
  #detail .rel a:hover{text-decoration:underline}
  #detail .rel a .verb{color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:.4px;margin-right:6px}
  .hint{position:fixed;bottom:14px;right:16px;color:var(--ink-faint);font-size:11px;
    background:#161c24cc;border:1px solid var(--line);border-radius:7px;padding:6px 9px;z-index:8}
  .resetbtn{position:fixed;bottom:14px;left:262px;z-index:9;background:var(--panel2);
    border:1px solid var(--line2);color:var(--ink-dim);border-radius:7px;padding:7px 12px;
    font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .resetbtn:hover{color:var(--ink);border-color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Product Development Lifecycle <span>· concept graph</span></h1>
    <div class="tabs" id="tabs"></div>
    <input id="search" placeholder="Search…" autocomplete="off"/>
  </header>
  <div id="main">
    <aside id="side"></aside>
    <div id="view"></div>
  </div>
  <div id="detail"><div class="x" onclick="closeDetail()">×</div><div id="detail-body"></div></div>
  <div class="hint" id="hint"></div>
  <button class="resetbtn" id="resetbtn" onclick="resetView()">⤢ Reset view</button>
</div>
<script>
const GRAPH = {"model":{"identifier":"product-development-lifecycle-model","name":"Product Development Lifecycle Graph","version":"1.0.0","description":"Graph model for product lifecycle stages, overlays, tracks, tools, roles, artifacts, metrics, decisions, and environments."},"bands":[{"identifier":"band.opportunity.signal","name":"Opportunity & signal","sequence_number":1},{"identifier":"band.discovery.validation","name":"Discovery & early validation","sequence_number":2},{"identifier":"band.definition.planning","name":"Definition & planning","sequence_number":3},{"identifier":"band.implementation.quality","name":"Implementation & internal quality","sequence_number":4},{"identifier":"band.release.delivery","name":"Release & delivery","sequence_number":5},{"identifier":"band.postlaunch.learning","name":"Post-launch validation & learning","sequence_number":6},{"identifier":"band.longterm.retirement","name":"Long-term lifecycle & retirement","sequence_number":7}],"tracks":[{"identifier":"track.discovery","name":"Discovery track","color":"#e0b94d"},{"identifier":"track.delivery","name":"Delivery track","color":"#4d9be0"},{"identifier":"track.validation","name":"Validation & learning track","color":"#7bc96f"},{"identifier":"track.operations","name":"Operational & service-health track","color":"#c97bd1"},{"identifier":"track.portfolio","name":"Portfolio governance track","color":"#e0734d"}],"nodes":[{"identifier":"backbone.product.development.lifecycle","type":"lifecycle_backbone","name":"Product development lifecycle","description":"The complete path from an opportunity signal or idea through validation, definition, implementation, delivery, learning, and eventual retirement."},{"identifier":"band.opportunity.signal","type":"lifecycle_band","name":"Opportunity & signal","description":"Lifecycle band 1.","sequence_number":1},{"identifier":"band.discovery.validation","type":"lifecycle_band","name":"Discovery & early validation","description":"Lifecycle band 2.","sequence_number":2},{"identifier":"band.definition.planning","type":"lifecycle_band","name":"Definition & planning","description":"Lifecycle band 3.","sequence_number":3},{"identifier":"band.implementation.quality","type":"lifecycle_band","name":"Implementation & internal quality","description":"Lifecycle band 4.","sequence_number":4},{"identifier":"band.release.delivery","type":"lifecycle_band","name":"Release & delivery","description":"Lifecycle band 5.","sequence_number":5},{"identifier":"band.postlaunch.learning","type":"lifecycle_band","name":"Post-launch validation & learning","description":"Lifecycle band 6.","sequence_number":6},{"identifier":"band.longterm.retirement","type":"lifecycle_band","name":"Long-term lifecycle & retirement","description":"Lifecycle band 7.","sequence_number":7},{"identifier":"stage.signal.collection","type":"lifecycle_stage","name":"Signal collection","description":"Capture raw inputs: customer feedback, sales input, analytics anomalies, market shifts, regulatory changes.","band_identifier":"band.opportunity.signal","sequence_number":1,"stage_kind":"exploratory"},{"identifier":"stage.idea.capture","type":"lifecycle_stage","name":"Idea capture","description":"Record opportunities, requests, and candidate product changes in a structured intake form.","band_identifier":"band.opportunity.signal","sequence_number":2,"stage_kind":"exploratory"},{"identifier":"stage.problem.discovery","type":"lifecycle_stage","name":"Problem discovery","description":"Investigate the underlying customer or business problem before selecting a solution.","band_identifier":"band.opportunity.signal","sequence_number":3,"stage_kind":"exploratory"},{"identifier":"stage.opportunity.assessment","type":"lifecycle_stage","name":"Opportunity assessment","description":"Evaluate impact, urgency, strategic fit, and rough risk.","band_identifier":"band.opportunity.signal","sequence_number":4,"stage_kind":"governance"},{"identifier":"stage.opportunity.framing","type":"lifecycle_stage","name":"Opportunity framing","description":"Convert noisy input into explicit problem statements or opportunity statements.","band_identifier":"band.opportunity.signal","sequence_number":5,"stage_kind":"definitional"},{"identifier":"stage.hypothesis.definition","type":"lifecycle_stage","name":"Hypothesis definition","description":"State the leap-of-faith assumptions and Cagan's four big risks: value, usability, feasibility, viability.","band_identifier":"band.discovery.validation","sequence_number":1,"stage_kind":"definitional"},{"identifier":"stage.solution.exploration","type":"lifecycle_stage","name":"Solution exploration","description":"Generate and compare candidate solutions, flows, and interaction models.","band_identifier":"band.discovery.validation","sequence_number":2,"stage_kind":"exploratory"},{"identifier":"stage.concept.prioritization","type":"lifecycle_stage","name":"Concept prioritization","description":"Select the most promising solution directions for testing.","band_identifier":"band.discovery.validation","sequence_number":3,"stage_kind":"definitional"},{"identifier":"stage.experiment.design","type":"lifecycle_stage","name":"Experiment design","description":"Define the smallest useful experiment to test a critical assumption.","band_identifier":"band.discovery.validation","sequence_number":4,"stage_kind":"exploratory"},{"identifier":"stage.experiment.execution","type":"lifecycle_stage","name":"Experiment execution","description":"Run prototypes, fake-door tests, concierge tests, and other validation experiments.","band_identifier":"band.discovery.validation","sequence_number":5,"stage_kind":"validation"},{"identifier":"stage.discovery.validation.checkpoint","type":"checkpoint","name":"Discovery validation checkpoint","description":"Decide whether to persevere, pivot, narrow scope, or stop (pivot-or-persevere).","band_identifier":"band.discovery.validation","sequence_number":6,"stage_kind":"governance"},{"identifier":"stage.requirement.specifi const byId={}; GRAPH.nodes.forEach(n=>byId[n.identifier]=n);
const edges=GRAPH.edges;
const bands=GRAPH.bands.slice().sort((a,b)=>a.sequence_number-b.sequence_number);

 implementation:'--kind-implementation',validation:'--kind-validation',governance:'--kind-governance'};

const stagesByBand={}; bands.forEach(b=>stagesByBand[b.identifier]=[]);
GRAPH.nodes.filter(n=>n.type==='lifecycle_stage'||n.type==='checkpoint').forEach(n=>stagesByBand[n.band_identifier].push(n));
Object.values(stagesByBand).forEach(a=>a.sort((x,y)=>x.sequence_number-y.sequence_number));

const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function E(tag,cls,parent,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(parent)parent.appendChild(e);return e;}
function wrap(s,max,maxLines){const w=s.split(' ');const lines=[];let cur='';
  w.forEach(word=>{if((cur+' '+word).trim().length>max&&cur){lines.push(cur);cur=word;}else cur=(cur+' '+word).trim();});
  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].replace(/.{1}$/,'…');}
  return lines;}

function sideHead(title,desc){const s=document.getElementById('side');

/* ---------------- LIFECYCLE (spatial) ---------------- */
const CARDW=182,CARDH=70,COLW=222,VGAP=26,TOP=70,LEFT=36;
function viewLifecycle(){
  const s=sideHead('Lifecycle map','The canonical backbone from signal to retirement. Seven bands, left to right; stages flow top-to-bottom within each band. Toggle the feedback loops and checkpoint routes that make this a graph, not a line.');
  E('h2',null,s,'Backbone');
  const lp=E('div','layer'+(lifecycleState.loops?' on':''),s);
  lp.innerHTML='<span class="ln" style="border-top-color:var(--loop);border-top-style:dashed"></span><span>Feedback loops & routes</span><span class="chk">✓</span>';
  lp.onclick=()=>{lifecycleState.loops=!lifecycleState.loops;draw();};
  E('h2',null,s,'Stage kind');
  [['Exploratory','--kind-exploratory'],['Definitional','--kind-definitional'],['Implementation','--kind-implementation'],['Validation','--kind-validation'],['Governance','--kind-governance']].forEach(([n,v])=>{
    const r=E('div','legendrow',s);r.innerHTML=`<span class="sw" style="background:var(${v})"></span>${n}`;});
  E('h2',null,s,'Edges');
  [['feedback loop','var(--loop)','dashed'],['checkpoint route','var(--route)','solid'],['sequence','var(--line2)','solid']].forEach(([n,c,st])=>{
    const r=E('div','legendrow',s);r.innerHTML=`<span class="ln" style="border-top-color:${c};border-top-style:${st}"></span>${n}`;});
  const ccr=E('div','legendrow',s);ccr.innerHTML='<span class="sw" style="background:transparent;border:1px dashed var(--kind-validation)"></span>cross-cutting lane';

  const pos={}; const ccByBand={};
  bands.forEach((b,ci)=>{
    ccByBand[b.identifier]=stagesByBand[b.identifier].filter(n=>n.crosscutting);
    stagesByBand[b.identifier].filter(n=>!n.crosscutting).forEach((n,ri)=>{
      const x=LEFT+ci*COLW,y=TOP+ri*(CARDH+VGAP);
      pos[n.identifier]={x,y,cx:x+CARDW/2,cy:y+CARDH/2};});});
  const maxRows=Math.max(...bands.map(b=>stagesByBand[b.identifier].filter(n=>!n.crosscutting).length));
  const bandBottom=TOP+maxRows*(CARDH+VGAP)-VGAP+12;
  const ccStripY=bandBottom+14;
  const hasCC=bands.some(b=>ccByBand[b.identifier].length);
  const loopLaneY=(hasCC?ccStripY+50:bandBottom+24);
  const loopEdges=edges.filter(e=>e.type==='can_loop_to'||e.type==='routes_to');
  const W=LEFT+bands.length*COLW+20, H=loopLaneY+ (lifecycleState.loops? loopEdges.length*16+40 : 30);
  const view=document.getElementById('view');
  const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,id:'svg'},view);
  const scene=el('g',{},svg);
  // arrow markers
  const defs=el('defs',{},scene);
  [['a-pre','var(--line2)'],['a-loop','var(--loop)'],['a-route','var(--route)']].forEach(([id,c])=>{
    const m=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
    el('path',{d:'M0,0 L10,5 L0,10z',fill:c},m);});
  // band columns
  bands.forEach((b,ci)=>{
    const x=LEFT+ci*COLW-16;
    el('rect',{x,y:TOP-12,width:CARDW+32,height:maxRows*(CARDH+VGAP)-VGAP+24,rx:12,fill:'#ffffff04',stroke:'var(--line)'},scene);
    const cx=x+(CARDW+32)/2;
    const hl=wrap(`${b.sequence_number}. ${b.name}`,18,3);
    const t=el('text',{x:cx,y:TOP-16-(hl.length-1)*13,'text-anchor':'middle',class:'bandlabel'},scene);
    hl.forEach((ln,i)=>{const ts=el('tspan',{x:cx,dy:i?13:0},t);ts.textContent=ln;});});
  const eL=el('g',{},scene);
  // precedes: within-column vertical (gap), cross-column via gutter elbow
  edges.filter(e=>e.type==='precedes').forEach(e=>{
    const a=pos[e.from],z=pos[e.to];if(!a||!z)return;
    if(Math.abs(a.x-z.x)<1){ el('path',{d:`M${a.cx},${a.y+CARDH} L${z.cx},${z.y}`,class:'edge e-precede','marker-end':'url(#a-pre)'},eL);}
    else{ const gx=a.x+CARDW+ (COLW-CARDW)/2; // gutter center between columns
      const d=`M${a.x+CARDW},${a.cy} L${gx},${a.cy} L${gx},${z.y-14} L${z.cx},${z.y-14} L${z.cx},${z.y}`;
      el('path',{d,class:'edge e-precede','marker-end':'url(#a-pre)','stroke-opacity':.7},eL);}
  });
  // loop lane (orthogonal, staggered)
  if(lifecycleState.loops){
    loopEdges.forEach((e,i)=>{
      const a=pos[e.from],z=pos[e.to];if(!a||!z)return;
      const lane=loopLaneY+i*16;const cls=e.type==='can_loop_to'?'e-loop':'e-route';
      const mk=e.type==='can_loop_to'?'url(#a-loop)':'url(#a-route)';
      const d=`M${a.cx},${a.y+CARDH} L${a.cx},${lane} L${z.cx},${lane} L${z.cx},${z.y+CARDH}`;
      el('path',{d,class:'edge '+cls,'marker-end':mk},eL);
      const lt=el('text',{x:(a.cx+z.cx)/2,y:lane-4,'text-anchor':'middle',class:'elabel',fill:e.type==='can_loop_to'?'var(--loop)':'var(--route)'},eL);
      lt.textContent=(byId[e.from].name.split(' ')[0])+' → '+byId[e.to].name+(e.label?` (${e.label})`:'');
    });
  }
  // cards
  GRAPH.nodes.filter(n=>pos[n.identifier]).forEach(n=>{
    const p=pos[n.identifier],isCp=n.type==='checkpoint';
    const g=el('g',{class:'card'+(isCp?' cp':''),transform:`translate(${p.x},${p.y})`},scene);
    el('rect',{class:'bx',x:0,y:0,width:CARDW,height:CARDH,rx:9},g);
    if(!isCp)el('rect',{x:0,y:0,width:5,height:CARDH,rx:2,fill:`var(${KIND[n.stage_kind]||'--line'})`},g);
    if(isCp)el('text',{x:CARDW-10,y:16,'text-anchor':'end',class:'elabel',fill:'var(--cp)'},g).textContent='◆ GATE';
    const lines=wrap(n.name,22,3);const startY=CARDH/2-(lines.length-1)*7+ (isCp?4:0);
    lines.forEach((ln,i)=>{const t=el('text',{x:14,y:startY+i*14,class:'nm'},g);t.textContent=ln;});
    g.onclick=ev=>{ev.stopPropagation();openDetail(n.identifier);};
  });
  // cross-cutting lanes (below the band column, out of the precedes chain)
  bands.forEach((b,ci)=>ccByBand[b.identifier].forEach((n,k)=>{
    const x=LEFT+ci*COLW-16,y=ccStripY+k*44,w=CARDW+32;
    const g=el('g',{class:'card',transform:`translate(${x},${y})`},scene);
    el('rect',{x:0,y:0,width:w,height:38,rx:8,fill:'#22282f',stroke:'var(--kind-validation)','stroke-width':1.3,'stroke-dasharray':'5 4'},g);
    el('text',{x:11,y:15,class:'elabel',fill:'var(--kind-validation)'},g).textContent='⋈ CROSS-CUTTING';
    const t=el('text',{x:11,y:30,class:'nm'},g);t.setAttribute('font-size','10.5');t.textContent=n.name;
    g.onclick=ev=>{ev.stopPropagation();openDetail(n.identifier);};
  }));
  enablePanZoom(svg,W,H);
  document.getElementById('hint').style.display='';
  document.getElementById('hint').textContent='drag to pan · scroll to zoom · click a stage';
}

function matrix(opts){
  // opts: {rows:[{id,name,color}], member:(rowId,stageId)->bool, cellColor:(rowId)->color}
  const s=sideHead(opts.title,opts.desc);
  if(opts.legend){opts.legend(s);}
  const wrapDiv=E('div','gridwrap',document.getElementById('view'));
  const tbl=E('table','mx',wrapDiv);
  const thead=E('thead',null,tbl);
  // band header row
  const trB=E('tr',null,thead);
  E('th','corner rowlbl',trB);
  bands.forEach(b=>{const th=E('th','band',trB,b.name);th.colSpan=stagesByBand[b.identifier].length;});
  // stage header row
  const trS=E('tr',null,thead);
  E('th','corner rowlbl',trS);
  bands.forEach((b,bi)=>stagesByBand[b.identifier].forEach((st,si)=>{

/* ---------------- PRODUCTS (named tooling catalog) ---------------- */
const STATUS_COLOR={active:'#6fcf97',acquired:'#5aa9e6',rebranded:'#e6c14d',sunset:'#e0734d',eol:'#e0734d'};
const productState={cats:new Set(PRODUCTS.categories.map(c=>c.id)),
  statuses:new Set(['active','acquired','rebranded','sunset','eol']),band:'all',viewMode:'catalog'};
function viewProducts(){
  const view=document.getElementById('view'); view.innerHTML=''; const s=document.getElementById('side'); s.innerHTML='';
  E('div','vtitle',s,'Products');
  E('div','vdesc',s,`${PRODUCTS.products.length} real products mapped to the lifecycle, with the specific feature that does the work. Comprehensive (leaders, challengers, OSS); discontinued tools are flagged. Filter below.`);
  // category filter
  E('h2',null,s,'Tool category');
  PRODUCTS.categories.forEach(c=>{
    const on=productState.cats.has(c.id);
    const r=E('div','layer'+(on?' on':''),s);
    r.innerHTML=`<span>${c.name}</span><span class="chk">✓</span>`;
    r.onclick=()=>{on?productState.cats.delete(c.id):productState.cats.add(c.id);viewProducts();};
    s.appendChild(r);
  });
  const allOn=productState.cats.size===PRODUCTS.categories.length;
  const tog=E('div','minibtn',s,allOn?'Clear all':'Select all');
  tog.onclick=()=>{allOn?productState.cats.clear():PRODUCTS.categories.forEach(c=>productState.cats.add(c.id));viewProducts();};
  E('h2',null,s,'Status');
  [['active','Active'],['acquired','Acquired'],['rebranded','Rebranded'],['sunset','Sunset / EOL']].forEach(([k,lbl])=>{
    const on=productState.statuses.has(k)||(k==='sunset'&&productState.statuses.has('eol'));
    const r=E('div','layer'+(on?' on':''),s);
    r.innerHTML=`<span class="sw" style="background:${STATUS_COLOR[k]}"></span><span>${lbl}</span><span class="chk">✓</span>`;
    r.onclick=()=>{const keys=k==='sunset'?['sunset','eol']:[k];
      const has=keys.every(x=>productState.statuses.has(x));
      keys.forEach(x=>has?productState.statuses.delete(x):productState.statuses.add(x));viewProducts();};
    s.appendChild(r);
  });
  E('h2',null,s,'Lifecycle band');
  const bandOpts=[['all','All bands']].concat(bands.map(b=>[b.identifier,`${b.sequence_number}. ${b.name}`]));
  bandOpts.forEach(([id,lbl])=>{
    const on=productState.band===id;
    const r=E('div','layer'+(on?' on':''),s);
    r.innerHTML=`<span>${lbl}</span><span class="chk">✓</span>`;
    r.onclick=()=>{productState.band=id;viewProducts();};
    s.appendChild(r);
  });

  // filter
  const bandStages_=productState.band==='all'?null:new Set(stagesByBand[productState.band].map(x=>x.identifier));
  const list=PRODUCTS.products.filter(p=>{
    if(!p.categories.some(c=>productState.cats.has(c)))return false;
    if(!productState.statuses.has(p.status))return false;
    if(bandStages_&&!p.stages.some(st=>bandStages_.has(st.stage)))return false;
    return true;
  });
  const wrapDiv=E('div','gridwrap prodwrap',view);
  // view-mode toggle
  const seg=E('div','segtoggle',wrapDiv);
  [['catalog','Catalog'],['matrix','Capability matrix']].forEach(([m,lbl])=>{
    const b=E('button','segbtn'+(productState.viewMode===m?' on':''),seg,lbl);
    b.onclick=()=>{productState.viewMode=m;viewProducts();};
  });
  E('div','prodcount',wrapDiv,`${list.length} of ${PRODUCTS.products.length} products shown`);
  // group by primary visible category
  const catName={}; PRODUCTS.categories.forEach(c=>catName[c.id]=c.name);
  const groups={}; PRODUCTS.categories.forEach(c=>groups[c.id]=[]);
  list.forEach(p=>{const primary=p.categories.find(c=>productState.cats.has(c))||p.categories[0];groups[primary].push(p);});

  if(productState.viewMode==='matrix'){
    if(productState.band==='all'&&list.length>60)
      E('div','prodhint',wrapDiv,'Tip: filter by a tool category or lifecycle band to narrow this matrix.');
    renderProductMatrix(wrapDiv,groups,catName);
  } else {
    PRODUCTS.categories.forEach(c=>{
      const items=groups[c.id]; if(!items.length)return;
      E('div','prodgrouphd',wrapDiv,`${c.name} · ${items.length}`);
      const grid=E('div','prodgrid',wrapDiv);
      items.forEach(p=>{
        const card=E('div','prodcard',grid);
        const head=E('div','prodhead',card);
        const nmEl=E('span','prodname',head);
        if(p.url){const a=E('a','prodlink',nmEl,p.name);a.href=p.url;a.target='_blank';a.rel='noopener';}
        else nmEl.textContent=p.name;
        const badge=E('span','prodstatus',head,p.status);
        badge.style.background=STATUS_COLOR[p.status]+'22';badge.style.color=STATUS_COLOR[p.status];
        E('div','prodvendor',card,p.vendor);
        const tags=E('div','prodtags',card);
        p.categories.forEach(cc=>{E('span','prodtag',tags,catName[cc]);});
        const stg=E('div','prodstages',card);
        p.stages.slice().sort((a,b)=>orderedStages.findIndex(o=>o.identifier===a.stage)-orderedStages.findIndex(o=>o.identifier===b.stage)).forEach(st=>{
          const row=E('div','prodstage',stg);
          const a=E('span','ps-stage',row,byId[st.stage]?byId[st.stage].name:st.stage);
          a.onclick=()=>openDetail(st.stage);
          E('span','ps-feat',row,' — '+st.feature);
        });
        if(p.note)E('div','prodnote',card,p.note);
      });
    });
  }
  document.getElementById('hint').style.display='none';
}
function renderProductMatrix(wrapDiv,groups,catName){
  const tbl=E('table','mx',wrapDiv);
  const thead=E('thead',null,tbl);
  const trB=E('tr',null,thead); E('th','corner rowlbl',trB);
  bands.forEach(b=>{const th=E('th','band',trB,b.name);th.colSpan=stagesByBand[b.identifier].length;});
  const trS=E('tr',null,thead); E('th','corner rowlbl',trS);
  bands.forEach((b,bi)=>stagesByBand[b.identifier].forEach((st,si)=>{
    const th=E('th','col'+(st.type==='checkpoint'?' cp':''),trS);
    if(si===0&&bi>0)th.style.borderLeft='1px solid var(--line)';
    const dv=E('div',null,th,st.name);dv.title=st.name;dv.onclick=()=>openDetail(st.identifier);}));
  const tb=E('tbody',null,tbl);
  const totalCols=1+orderedStages.length;
  PRODUCTS.categories.forEach(c=>{
    const items=groups[c.id]; if(!items.length)return;
    const ghr=E('tr','mxgrouprow',tb); const gtd=E('td','mxgroup',ghr,`${catName[c.id]} · ${items.length}`); gtd.colSpan=totalCols;
    items.forEach(p=>{
      const stageMap={}; p.stages.forEach(x=>stageMap[x.stage]=x.feature);
      const tr=E('tr',null,tb);
      const lbl=E('td','rowlbl prodrow',tr);
      lbl.innerHTML=`<span class="sw" style="background:${STATUS_COLOR[p.status]}"></span>`+
        (p.url?`<a class="prodlink" href="${p.url}" target="_blank" rel="noopener">${p.name}</a>`:p.name);
      lbl.title=p.vendor+(p.note?' — '+p.note:'');
      bands.forEach((b,bi)=>stagesByBand[b.identifier].forEach((st,si)=>{
        const td=E('td','cell'+(si===0&&bi>0?' bandsep':''),tr);
        const feat=stageMap[st.identifier];
        if(feat){
          const dot=E('span','dot',td);dot.style.background=STATUS_COLOR[p.status];
          dot.title=`${p.name} · ${byId[st.identifier].name}: ${feat}`;
          dot.onclick=()=>openDetail(st.identifier);
        }
      }));
    });
  });
}

const REL=[['precedes','from','→ next'],['precedes','to','← previous'],
 ['can_loop_to','from','loops to'],['can_loop_to','to','loop from'],['routes_to','from','routes to'],['routes_to','to','route from'],
 ['contains','to','in band'],['applies_to','to','method applies'],['spans','to','in track'],
 ['owned_by','from','owner'],['produces','from','produces'],['consumes','from','consumes'],
 ['supported_by','from','tool'],['measured_by','from','metric'],['governs','to','governed by'],
 ['occurs_in','from','environment'],['informs','from','informs'],['informs','to','informed by'],
 ['practiced_at','to','practice here'],['practiced_at','from','applies to stage'],
 ['applies_to','from','applies to stage'],['spans','from','spans stage'],['supported_by','to','supports stage'],
 ['measured_by','to','measures stage'],['governs','from','governs stage'],['occurs_in','to','stage here'],['produces','to','produced by'],['consumes','to','consumed by'],['owned_by','to','owns stage']];
function openDetail(id){
  const n=byId[id];if(!n)return;
  const b=document.getElementById('detail-body');
  let h=`<span class="tag">${n.type.replace(/_/g,' ')}</span>`;
  if(n.stage_kind)h+=`<span class="tag">${n.stage_kind}</span>`;
  if(n.band_identifier)h+=`<span class="tag">${byId[n.band_identifier].name}</span>`;
  h+=`<h3>${n.name}</h3><div class="desc">${n.description}</div>`;
  const groups={};const seen=new Set();
  REL.forEach(([etype,side,verb])=>{
    edges.filter(e=>e.type===etype&&e[side]===id).forEach(e=>{
      const other=side==='from'?e.to:e.from;if(!byId[other])return;
      const key=verb+'|'+other;if(seen.has(key))return;seen.add(key);
      (groups[verb]=groups[verb]||[]).push({other,label:e.label});});
  });
  Object.keys(groups).forEach(verb=>{
    h+=`<div class="rel"><h4>${verb}</h4>`;
    groups[verb].forEach(({other,label})=>{h+=`<a onclick="openDetail('${other}')"><span class="verb">${byId[other].type.split('_')[0]}</span>${byId[other].name}${label?` <em style="color:var(--ink-faint)">(${label})</em>`:''}</a>`;});
    h+='</div>';});
  b.innerHTML=h;document.getElementById('detail').classList.add('open');
}
function closeDetail(){document.getElementById('detail').classList.remove('open');}

/* ---------------- PAN/ZOOM ---------------- */
function enablePanZoom(svg,W,H){
  let vb={x:0,y:0,w:W,h:H},drag=false,sx,sy;
  const set=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  _resetView=()=>{vb={x:0,y:0,w:W,h:H};set();};
  svg.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sy=e.clientY;svg.classList.add('drag');});
  window.addEventListener('mouseup',()=>{drag=false;svg.classList.remove('drag');});
  window.addEventListener('mousemove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();
    vb.x-=(e.clientX-sx)*vb.w/r.width;vb.y-=(e.clientY-sy)*vb.h/r.height;sx=e.clientX;sy=e.clientY;set();});
  svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();
    const mx=vb.x+(e.clientX-r.left)/r.width*vb.w,my=vb.y+(e.clientY-r.top)/r.height*vb.h;
    const f=e.deltaY>0?1.1:0.9;vb.w*=f;vb.h*=f;vb.x=mx-(e.clientX-r.left)/r.width*vb.w;vb.y=my-(e.clientY-r.top)/r.height*vb.h;set();},{passive:false});
}
